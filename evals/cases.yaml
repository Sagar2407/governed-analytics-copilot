# Benchmark cases. Each runs against BOTH fixtures; a case passes only if it passes on
# both (a query "right by luck" on one seed fails on the other).
#
# expect: answer | clarify | abstain
# gold_plan: the reference plan (used for numeric correctness + planner-structure scoring);
#            gold numeric answers are computed by the INDEPENDENT oracle, never hand-typed.
# leak_check: verify the answer is correctly scoped to the persona (RLS / adversarial).

# --- revenue -------------------------------------------------------------------------
- id: arr_total
  question: "What is our ARR?"
  persona: PER-FINANCE
  expect: answer
  category: revenue
  gold_plan: {metric: arr}
- id: mrr_total
  question: "What is our MRR right now?"
  persona: PER-FINANCE
  expect: answer
  category: revenue
  gold_plan: {metric: mrr}
- id: recognized_revenue_ltm
  question: "recognized revenue over the last 12 months"
  persona: PER-FINANCE
  expect: answer
  category: revenue
  gold_plan: {metric: recognized_revenue, time: {type: last_n_months, n: 12}}
- id: active_customers
  question: "how many active customers do we have"
  persona: PER-FINANCE
  expect: answer
  category: customers
  gold_plan: {metric: active_customers}
- id: gross_billings_ltm
  question: "gross billings last 12 months"
  persona: PER-FINANCE
  expect: answer
  category: revenue
  gold_plan: {metric: gross_billings, time: {type: last_n_months, n: 12}}
- id: net_revenue_ltm
  question: "net revenue last 12 months"
  persona: PER-FINANCE
  expect: answer
  category: revenue
  gold_plan: {metric: net_revenue, time: {type: last_n_months, n: 12}}

